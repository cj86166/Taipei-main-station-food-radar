
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>台北車站美食雷達 🍜</title>
  <meta name="description" content="和朋友一起分享台北車站商圈的美食、必吃料理與真實推薦。">

  <style>
    :root {
      --pink: #ff7ca8;
      --yellow: #ffe66d;
      --mint: #b8f2e6;
      --purple: #cdb4db;
      --ink: #342d40;
      --muted: #777184;
      --paper: #fffaf5;
      --white: #ffffff;
      --border: #eee4ed;
      --shadow: 0 8px 24px rgba(78, 48, 87, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      background:
        radial-gradient(circle at 10% 5%, #ffe3ed 0, transparent 25%),
        radial-gradient(circle at 95% 15%, #e5ddff 0, transparent 24%),
        var(--paper);
      color: var(--ink);
      line-height: 1.6;
    }

    .container {
      width: min(100% - 32px, 1050px);
      margin: 0 auto;
    }

    header {
      padding: 42px 0 28px;
      text-align: center;
    }

    .eyebrow {
      display: inline-block;
      background: var(--yellow);
      padding: 5px 14px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 800;
      transform: rotate(-2deg);
    }

    h1 {
      font-size: clamp(30px, 5vw, 46px);
      line-height: 1.2;
      margin: 18px 0 10px;
      letter-spacing: 1px;
    }

    .subtitle {
      margin: 0 auto;
      max-width: 580px;
      color: var(--muted);
    }

    .section-title {
      font-size: 23px;
      margin: 0 0 18px;
    }

    .panel {
      background: rgba(255, 255, 255, 0.92);
      border: 2px solid var(--border);
      border-radius: 24px;
      padding: clamp(18px, 4vw, 30px);
      box-shadow: var(--shadow);
      margin-bottom: 30px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    .field {
      min-width: 0;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    label {
      display: block;
      font-weight: 800;
      margin-bottom: 7px;
      font-size: 14px;
    }

    .required {
      color: #e64d83;
      margin-left: 4px;
    }

    input,
    textarea {
      width: 100%;
      border: 2px solid #eee5ef;
      border-radius: 13px;
      background: #fff;
      padding: 12px 14px;
      font: inherit;
      color: var(--ink);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus,
    textarea:focus {
      border-color: var(--purple);
      box-shadow: 0 0 0 3px rgba(205, 180, 219, 0.2);
    }

    textarea {
      resize: vertical;
      min-height: 88px;
    }

    .hint {
      font-size: 12px;
      color: var(--muted);
      margin-top: 5px;
    }

    .stars {
      display: flex;
      gap: 7px;
      align-items: center;
      flex-wrap: wrap;
    }

    .star {
      border: 0;
      background: #f3edf5;
      color: #c7bdce;
      border-radius: 12px;
      font-size: 30px;
      width: 48px;
      height: 48px;
      cursor: pointer;
      transition: transform 0.15s, background 0.15s;
    }

    .star:hover {
      transform: translateY(-2px);
    }

    .star.active {
      background: #fff0a8;
      color: #f5a623;
    }

    #ratingText {
      color: var(--muted);
      font-size: 13px;
      margin-left: 4px;
    }

    .submit-row {
      margin-top: 22px;
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .submit-btn {
      border: 0;
      border-radius: 14px;
      background: var(--pink);
      color: #fff;
      padding: 13px 25px;
      font: inherit;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 5px 0 #e65d8b;
      transition: transform 0.15s, box-shadow 0.15s;
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 7px 0 #e65d8b;
    }

    .submit-btn:disabled {
      opacity: 0.6;
      cursor: wait;
      transform: none;
    }

    #formMessage {
      font-size: 14px;
      font-weight: 700;
    }

    .list-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    .count {
      background: var(--mint);
      border-radius: 999px;
      padding: 6px 13px;
      font-size: 13px;
      font-weight: 800;
    }

    .restaurant-list {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    .restaurant-card {
      position: relative;
      background: #fff;
      border: 2px solid var(--border);
      border-radius: 20px;
      padding: 22px;
      overflow-wrap: anywhere;
      box-shadow: var(--shadow);
    }

    .restaurant-card:nth-child(4n + 1) {
      border-top: 5px solid var(--pink);
    }

    .restaurant-card:nth-child(4n + 2) {
      border-top: 5px solid var(--yellow);
    }

    .restaurant-card:nth-child(4n + 3) {
      border-top: 5px solid var(--mint);
    }

    .restaurant-card:nth-child(4n + 4) {
      border-top: 5px solid var(--purple);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
    }

    .restaurant-name {
      margin: 0;
      font-size: 21px;
      line-height: 1.4;
    }

    .rating {
      white-space: nowrap;
      color: #efa900;
      font-size: 15px;
      letter-spacing: -1px;
    }

    .card-info {
      margin-top: 17px;
      display: grid;
      gap: 11px;
    }

    .info-label {
      display: block;
      font-size: 12px;
      font-weight: 800;
      color: var(--muted);
      margin-bottom: 2px;
    }

    .info-value {
      white-space: pre-wrap;
      font-size: 15px;
    }

    .dish-tag {
      display: inline-block;
      background: #fff2bf;
      border-radius: 8px;
      padding: 3px 9px;
      font-weight: 800;
    }

    .price {
      color: #d84c7d;
      font-weight: 900;
    }

    .collected-time {
      margin-top: 18px;
      padding-top: 12px;
      border-top: 1px dashed #e8dfe9;
      color: var(--muted);
      font-size: 12px;
    }

    .empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 42px 18px;
      border: 2px dashed #e4d9e8;
      border-radius: 20px;
      color: var(--muted);
      background: rgba(255,255,255,0.7);
    }

    .empty .emoji {
      font-size: 38px;
      display: block;
      margin-bottom: 8px;
    }

    footer {
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      padding: 12px 0 35px;
    }

    @media (max-width: 650px) {
      .form-grid,
      .restaurant-list {
        grid-template-columns: 1fr;
      }

      header {
        padding-top: 30px;
      }

      .panel {
        border-radius: 18px;
      }

      .star {
        width: 43px;
        height: 43px;
        font-size: 27px;
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="container">
      <span class="eyebrow">TAIPEI FOOD RADAR ✦</span>
      <h1>台北車站美食雷達 🍜</h1>
      <p class="subtitle">
        好吃的店，不藏私！和朋友一起分享台北車站商圈的口袋名單，
        下一餐就跟著大家的推薦吃。
      </p>
    </div>
  </header>

  <main class="container">
    <section class="panel">
      <h2 class="section-title">📍 分享你的口袋美食</h2>

      <form id="restaurantForm">
        <div class="form-grid">
          <div class="field">
            <label for="recommender">美食推薦人<span class="required">*</span></label>
            <input
              id="recommender"
              name="recommender"
              type="text"
              maxlength="50"
              placeholder="例如：小明"
              autocomplete="name"
              required
            >
          </div>

          <div class="field">
            <label for="restaurant">餐廳名稱<span class="required">*</span></label>
            <input
              id="restaurant"
              name="restaurant"
              type="text"
              maxlength="100"
              placeholder="例如：阜杭豆漿"
              required
            >
          </div>

          <div class="field full">
            <label>推薦星等<span class="required">*</span></label>
            <div class="stars" id="starPicker" aria-label="選擇推薦星等">
              <button class="star" type="button" data-rating="1" aria-label="1 星" aria-pressed="false">★</button>
              <button class="star" type="button" data-rating="2" aria-label="2 星" aria-pressed="false">★</button>
              <button class="star" type="button" data-rating="3" aria-label="3 星" aria-pressed="false">★</button>
              <button class="star" type="button" data-rating="4" aria-label="4 星" aria-pressed="false">★</button>
              <button class="star" type="button" data-rating="5" aria-label="5 星" aria-pressed="false">★</button>
              <span id="ratingText">請選擇星等</span>
            </div>
          </div>

          <div class="field full">
            <label for="dish">推薦料理<span class="required">*</span></label>
            <input
              id="dish"
              name="dish"
              type="text"
              maxlength="200"
              placeholder="例如：厚燒餅、蛋餅、招牌牛肉麵"
              required
            >
          </div>

          <div class="field full">
            <label for="reason">推薦原因<span class="required">*</span></label>
            <textarea
              id="reason"
              name="reason"
              maxlength="500"
              placeholder="例如：份量十足、價格實惠、交通方便，或是湯頭很有特色……"
              required
            ></textarea>
          </div>

          <div class="field full">
            <label for="price">推薦餐點的價格（新台幣）<span class="required">*</span></label>
            <input
              id="price"
              name="price"
              type="number"
              min="0"
              max="1000000"
              step="1"
              inputmode="numeric"
              placeholder="例如：150"
              required
            >
            <div class="hint">請填寫推薦餐點的價格，單位為新台幣元。</div>
          </div>
        </div>

        <div class="submit-row">
          <button class="submit-btn" id="submitBtn" type="submit">送出美食推薦 ✨</button>
          <span id="formMessage" role="status" aria-live="polite"></span>
        </div>
      </form>
    </section>

    <section>
      <div class="list-heading">
        <h2 class="section-title" style="margin:0">🍽️ 大家的美食名單</h2>
        <span class="count" id="restaurantCount">共 0 間推薦</span>
      </div>

      <div class="restaurant-list" id="restaurantList" aria-live="polite">
        <div class="empty">
          <span class="emoji">🍜</span>
          <strong>美食雷達準備中……</strong>
          <div>正在讀取大家分享的口袋名單。</div>
        </div>
      </div>
    </section>
  </main>

  <footer class="container">
    一起發掘台北車站周邊的好味道 💛
    <br>
    資料蒐集時間以台灣時間（UTC+8）顯示。
  </footer>

  <script type="module">
    import { initializeApp } from
      "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

    import {
      getFirestore,
      collection,
      addDoc,
      serverTimestamp,
      query,
      orderBy,
      onSnapshot
    } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD1h8lKs_uUq3xcU0Hb9WGSJ7KIVqemn34",
      authDomain: "test-d615e.firebaseapp.com",
      projectId: "test-d615e",
      storageBucket: "test-d615e.firebasestorage.app",
      messagingSenderId: "719884173005",
      appId: "1:719884173005:web:14b04acb937fa3b5ab3384"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const restaurantsRef = collection(db, "restaurants");

    const form = document.getElementById("restaurantForm");
    const submitBtn = document.getElementById("submitBtn");
    const formMessage = document.getElementById("formMessage");
    const restaurantList = document.getElementById("restaurantList");
    const restaurantCount = document.getElementById("restaurantCount");
    const ratingText = document.getElementById("ratingText");
    const starButtons = [...document.querySelectorAll(".star")];

    let selectedRating = 0;

    function setRating(value) {
      selectedRating = value;

      starButtons.forEach((button) => {
        const active = Number(button.dataset.rating) <= value;
        button.classList.toggle("active", active);
        button.setAttribute("aria-pressed",
          String(Number(button.dataset.rating) === value));
      });

      ratingText.textContent = value
        ? `${value} 星${"★".repeat(value)}`
        : "請選擇星等";
    }

    starButtons.forEach((button) => {
      button.addEventListener("click", () => {
        setRating(Number(button.dataset.rating));
      });
    });

    // 將 Firebase 時間格式化為台灣時間：YYYY/MM/DD HH:mm
    function formatTaiwanTime(timestamp) {
      if (!timestamp || typeof timestamp.toDate !== "function") {
        return "時間資料尚未提供";
      }

      const date = timestamp.toDate();

      const parts = new Intl.DateTimeFormat("en-CA", {
        timeZone: "Asia/Taipei",
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
        hourCycle: "h23"
      }).formatToParts(date);

      const values = {};
      parts.forEach((part) => {
        if (part.type !== "literal") {
          values[part.type] = part.value;
        }
      });

      return `${values.year}/${values.month}/${values.day} ${values.hour}:${values.minute}`;
    }

    function createInfo(label, value, extraClass = "") {
      const wrapper = document.createElement("div");

      const title = document.createElement("span");
      title.className = "info-label";
      title.textContent = label;

      const content = document.createElement("div");
      content.className = `info-value ${extraClass}`.trim();
      content.textContent = value;

      wrapper.append(title, content);
      return wrapper;
    }

    function renderRestaurants(snapshot) {
      restaurantList.replaceChildren();
      restaurantCount.textContent = `共 ${snapshot.size} 間推薦`;

      if (snapshot.empty) {
        const empty = document.createElement("div");
        empty.className = "empty";

        const emoji = document.createElement("span");
        emoji.className = "emoji";
        emoji.textContent = "🍜";

        const title = document.createElement("strong");
        title.textContent = "目前還沒有美食推薦";

        const hint = document.createElement("div");
        hint.textContent = "成為第一位分享美食的人吧！";

        empty.append(emoji, title, hint);
        restaurantList.appendChild(empty);
        return;
      }

      snapshot.forEach((docSnap) => {
        const data = docSnap.data();
        const card = document.createElement("article");
        card.className = "restaurant-card";

        const top = document.createElement("div");
        top.className = "card-top";

        const name = document.createElement("h3");
        name.className = "restaurant-name";
        name.textContent = data.restaurant || "未命名餐廳";

        const rating = document.createElement("div");
        rating.className = "rating";
        const score = Number(data.rating) || 0;
        rating.textContent =
          "★".repeat(Math.max(0, Math.min(5, score))) +
          "☆".repeat(5 - Math.max(0, Math.min(5, score)));
        rating.setAttribute("aria-label", `${score} 星評分`);

        top.append(name, rating);

        const info = document.createElement("div");
        info.className = "card-info";

        info.appendChild(createInfo(
          "🙋 美食推薦人",
          data.recommender || "尚未提供"
        ));

        const dish = createInfo(
          "🥢 推薦料理",
          data.dish || "尚未提供"
        );
        dish.querySelector(".info-value").classList.add("dish-tag");
        info.appendChild(dish);

        info.appendChild(createInfo(
          "💬 推薦原因",
          data.reason || "尚未提供"
        ));

        const priceText =
          data.price !== undefined && data.price !== null && data.price !== ""
            ? `NT$ ${Number(data.price).toLocaleString("zh-TW")}`
            : "尚未提供";

        info.appendChild(createInfo("💰 推薦餐點價格", priceText, "price"));

        const time = document.createElement("div");
        time.className = "collected-time";
        time.textContent = `🕒 資料蒐集時間：${formatTaiwanTime(data.createdAt)}`;

        card.append(top, info, time);
        restaurantList.appendChild(card);
      });
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const recommender = document.getElementById("recommender").value.trim();
      const restaurant = document.getElementById("restaurant").value.trim();
      const dish = document.getElementById("dish").value.trim();
      const reason = document.getElementById("reason").value.trim();
      const priceValue = document.getElementById("price").value;

      if (!selectedRating) {
        formMessage.textContent = "請先選擇 1～5 星評分。";
        formMessage.style.color = "#d84c7d";
        return;
      }

      if (!recommender || !restaurant || !dish || !reason || priceValue === "") {
        formMessage.textContent = "請完整填寫所有欄位。";
        formMessage.style.color = "#d84c7d";
        return;
      }

      const price = Number(priceValue);

      if (!Number.isFinite(price) || price < 0 || price > 1000000) {
        formMessage.textContent = "請輸入有效的餐點價格。";
        formMessage.style.color = "#d84c7d";
        return;
      }

      submitBtn.disabled = true;
      formMessage.textContent = "正在儲存你的推薦……";
      formMessage.style.color = "#777184";

      try {
        await addDoc(restaurantsRef, {
          recommender,
          restaurant,
          rating: selectedRating,
          dish,
          reason,
          price,
          createdAt: serverTimestamp()
        });

        form.reset();
        setRating(0);

        formMessage.textContent = "推薦成功！已同步到美食名單 🎉";
        formMessage.style.color = "#168568";
      } catch (error) {
        console.error("儲存失敗：", error);
        formMessage.textContent =
          "儲存失敗，請檢查 Firebase 資料庫與安全規則設定。";
        formMessage.style.color = "#d84c7d";
      } finally {
        submitBtn.disabled = false;
      }
    });

    const restaurantsQuery = query(
      restaurantsRef,
      orderBy("createdAt", "desc")
    );

    onSnapshot(
      restaurantsQuery,
      renderRestaurants,
      (error) => {
        console.error("讀取資料失敗：", error);

        restaurantList.replaceChildren();

        const message = document.createElement("div");
        message.className = "empty";
        message.textContent =
          "目前無法讀取美食名單，請確認 Firestore 已啟用且安全規則正確。";

        restaurantList.appendChild(message);
      }
    );
  </script>
</body>
</html>
